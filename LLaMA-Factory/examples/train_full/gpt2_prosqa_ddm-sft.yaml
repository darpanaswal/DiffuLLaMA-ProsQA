# LLaMA-Factory/examples/train_full/gpt2_prosqa_ddm-sft.yaml
#
# DiffuGPT-M diffusion SFT (ddm-sft) on ProsQA chain-of-thought.
# Derived from the repo's gpt2_full_ddm-sft.yaml (GSM8K example). Key changes:
#   - dataset -> prosqa_train (register in LLaMA-Factory/data/dataset_info.json)
#   - cutoff_len -> 640  (ProsQA full Q+CoT+answer reaches ~p99 540, max ~660;
#                         256/512 truncate the 6-hop chains we most want for DLIG.
#                         Confirm with the real-tokenizer length report from
#                         scripts/prosqa_to_diffusft.py --report before locking.)
#   - eval_dataset -> prosqa_valid
# Keep anneal_steps=1 (base already bidirectional) and shift=true (DiffuGPT-M
# predicts shifted, matching the attribution backend's predicts_shifted=True).

### model
model_name_or_path: gpt2-medium                       # AR base: config only
checkpoint_dir: ../models/diffugpt-m

### method
stage: ddm-sft        # diffusion SFT (NOT ddm pre-training)
do_train: true
finetuning_type: full
anneal_steps: 1       # no attention anneal for finetune; base is bidirectional
shift: true           # DiffuGPT-M predicts in-shifted convention
remove_unused_columns: false   # keep src_mask column for the diffusion trainer

### dataset
dataset: prosqa_train
eval_dataset: prosqa_valid
template: empty
cutoff_len: 640         # ProsQA p99 ~540, max ~660; confirm via --report before locking
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: output/diffugpt-m-prosqa
logging_steps: 20
save_steps: 500
plot_loss: true
overwrite_output_dir: true
report_to: wandb
run_name: diffugpt-m-prosqa-ddmsft
save_safetensors: false  # <-- ADD THIS LINE

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 4
learning_rate: 1.0e-5
num_train_epochs: 10.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: false           # RTX 8000 = Turing (sm_75), NO native bf16
fp16: true            # Turing supports fp16 tensor cores
ddp_timeout: 180000000

### eval
val_size: 0.0         # use explicit eval_dataset (prosqa_valid) instead of a split
per_device_eval_batch_size: 8
eval_strategy: steps
eval_steps: 500